<!-- ========================================================================= -->
<!-- MÓDULO UNIFICADO: CATÁLOGO, CHECKOUT, POLLING E PAINEL ADMIN             -->
<!-- ========================================================================= -->
<script>
// 1. CONFIGURAÇÃO GLOBAL DA API (Acessível por toda a página)
window.CLOUDFLARE_TUNNEL_URL = "https://loja.gontijotech.com.br";

window.getApiBaseUrl = function() {
  return (localStorage.getItem('gtstore_api_url') || window.CLOUDFLARE_TUNNEL_URL).replace(/\/+$/, '');
};

// 2. CARREGAMENTO DO CATÁLOGO (Impede tela preta se a API demorar ou falhar)
window.loadPackages = async function() {
  const container = document.getElementById("catalog") || document.getElementById("view-catalog");

  try {
    const res = await fetch(`${window.getApiBaseUrl()}/api/packages?_t=${Date.now()}`, { 
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });

    if (!res.ok) throw new Error("Status HTTP: " + res.status);

    const data = await res.json();
    const lista = data.items || data.packages || [];

    if (lista.length === 0) {
      if (container) {
        container.innerHTML = '<div style="color:#8a94a6; text-align:center; padding:60px 20px;">Nenhum jogo cadastrado no servidor Android.</div>';
      }
      return;
    }

    // Se o seu index.html já tiver as funções originais de montagem, repassa os dados:
    if (typeof buildCatalog === "function" && typeof renderCatalog === "function") {
      window.allPackages = lista;
      window.games = buildCatalog(lista);
      renderCatalog();
      if (typeof updateCartTopButton === "function") updateCartTopButton();
    }

  } catch (err) {
    console.error("[GTSTORE] Falha ao carregar catálogo:", err);
    if (container) {
      container.innerHTML = `
        <div style="text-align:center; padding:50px 20px; color:#f5f7fa; font-family:sans-serif;">
          <h3 style="color:#ff453a; margin-bottom:8px;">Servidor Temporariamente Inacessível</h3>
          <p style="color:#8a94a6; font-size:13px; max-width:460px; margin:0 auto 16px;">
            Não foi possível comunicar com <b>${window.getApiBaseUrl()}</b>.<br>
            Verifique se o aplicativo no Android e o Cloudflare Tunnel estão ativos.
          </p>
          <button onclick="window.loadPackages()" style="background:#0070d1; color:#fff; border:0; padding:10px 20px; border-radius:6px; font-weight:700; cursor:pointer;">
            Tentar Novamente
          </button>
        </div>
      `;
    }
  }
};

// Inicia o catálogo assim que a estrutura do DOM estiver pronta
document.addEventListener('DOMContentLoaded', () => {
  window.loadPackages();
});

(() => {
  let statusPollTimer = null;
  let adminRefreshTimer = null;
  const POLL_INTERVAL_MS = 2500;
  const MAX_POLL_ATTEMPTS = 120;

  // 3. GERENCIAMENTO DE IP DO CONSOLE
  function getPs4Ip() {
    return localStorage.getItem('gtstore_ps4_ip') || '';
  }

  function setPs4Ip(ip) {
    const limpo = ip.trim();
    localStorage.setItem('gtstore_ps4_ip', limpo);
    const input = document.querySelector('.ps4-ip-input');
    if (input) input.value = limpo;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.querySelector('.ps4-ip-input');
    const btnSave = document.querySelector('.btn-save-ip');
    if (input) {
      input.value = getPs4Ip();
      input.addEventListener('change', (e) => setPs4Ip(e.target.value));
    }
    if (btnSave && input) {
      btnSave.addEventListener('click', () => {
        setPs4Ip(input.value);
        exibirNotificacao("IP do console salvo com sucesso!", "success");
      });
    }
  });

  // 4. CHECKOUT E ENVIO DO PEDIDO
  window.iniciarCheckout = async function(itens) {
    if (!itens || itens.length === 0) {
      exibirNotificacao("O carrinho está vazio.", "warning");
      return;
    }

    try {
      exibirModalProcessamento("Enviando solicitação de autorização...");

      const endpoint = `${window.getApiBaseUrl()}/api/order/create`;
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          items: itens,
          ps4Ip: getPs4Ip()
        })
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      if (!data.success || !data.orderId) {
        throw new Error(data.error || "Identificador do pedido não recebido.");
      }

      atualizarMensagemModal(
        `Solicitação <b>#${data.orderId}</b> registrada!<br><br>` +
        `Aguardando autorização no painel <b>Admin</b>...`
      );

      iniciarLoopPolling(data.orderId);

    } catch (err) {
      console.error("[GTSTORE] Erro no checkout:", err);
      fecharModalProcessamento();
      exibirNotificacao("Falha ao contactar servidor: " + err.message, "error");
    }
  };

  // 5. POLLING DE STATUS
  function iniciarLoopPolling(orderId) {
    if (statusPollTimer) clearTimeout(statusPollTimer);
    let tentativas = 0;

    const executarChecagem = async () => {
      tentativas++;

      try {
        const url = `${window.getApiBaseUrl()}/api/order/status?id=${encodeURIComponent(orderId)}&_t=${Date.now()}`;
        const res = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const dados = await res.json();

        if (dados.status === 'approved') {
          fecharModalProcessamento();
          exibirNotificacao("Pedido AUTORIZADO com sucesso!", "success");
          exibirTelaDeDownloads(dados);
          processarInstalacaoNoConsole(dados);
          return;
        }

        if (dados.status === 'rejected') {
          fecharModalProcessamento();
          exibirNotificacao("A solicitação foi recusada pelo administrador.", "error");
          return;
        }

        if (tentativas < MAX_POLL_ATTEMPTS) {
          statusPollTimer = setTimeout(executarChecagem, POLL_INTERVAL_MS);
        } else {
          fecharModalProcessamento();
          exibirNotificacao("Tempo de espera esgotado.", "warning");
        }

      } catch (err) {
        console.warn(`[GTSTORE] Falha temporária no polling (${tentativas}):`, err);
        if (tentativas < MAX_POLL_ATTEMPTS) {
          statusPollTimer = setTimeout(executarChecagem, POLL_INTERVAL_MS);
        } else {
          fecharModalProcessamento();
          exibirNotificacao("Comunicação interrompida com o servidor.", "error");
        }
      }
    };

    statusPollTimer = setTimeout(executarChecagem, 1500);
  }

  // 6. LIBERAÇÃO DA TELA DE DOWNLOADS
  function exibirTelaDeDownloads(dadosPedido) {
    const viewCatalog = document.getElementById("view-catalog");
    if (viewCatalog) viewCatalog.style.display = "none";

    const viewDownloads = document.getElementById("view-downloads");
    if (viewDownloads) {
      viewDownloads.classList.add("active");
      viewDownloads.style.display = "block";
    }

    if (typeof showDownloadsView === "function") {
      showDownloadsView();
      return;
    }

    const listContainer = document.getElementById("downloads-list");
    if (listContainer && dadosPedido.items) {
      listContainer.innerHTML = "";
      dadosPedido.items.forEach((urlPkg, idx) => {
        const nomeArquivo = urlPkg.substring(urlPkg.lastIndexOf('/') + 1) || `Pacote #${idx + 1}`;
        const itemCard = document.createElement("div");
        itemCard.style.cssText = `
          background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex;
          justify-content: space-between; align-items: center; gap: 12px;
        `;
        itemCard.innerHTML = `
          <div>
            <div style="font-weight: 800; color: #fff; font-size: 14px;">${nomeArquivo}</div>
            <div style="font-size: 12px; color: #8a94a6; margin-top: 4px;">Arquivo pronto para transferência</div>
          </div>
          <a href="${urlPkg}" target="_blank" download style="
            background: #2ecc71; color: #020305; padding: 10px 18px; border-radius: 8px;
            text-decoration: none; font-weight: 800; font-size: 12px; display: inline-block;">
            BAIXAR ARQUIVO
          </a>
        `;
        listContainer.appendChild(itemCard);
      });
    }
  }

  async function processarInstalacaoNoConsole(dadosPedido) {
    if (!dadosPedido.items || dadosPedido.items.length === 0) return;

    for (let i = 0; i < dadosPedido.items.length; i++) {
      const urlPkg = dadosPedido.items[i];
      try {
        const rpiResponse = await fetch('http://127.0.0.1:12800/server/install', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: "direct",
            packages: [urlPkg]
          })
        });

        if (rpiResponse.ok) {
          exibirNotificacao(`Instalação enviada ao RPI (${i + 1}/${dadosPedido.items.length})`, "success");
        }
      } catch (err) {
        console.warn("[GTSTORE] RPI local inacessível (utilize o botão manual de download).", err);
      }
    }
  }

  // 7. PAINEL DE CONTROLE DO ADMINISTRADOR
  window.carregarPedidosAdmin = async function(containerElementId = 'admin-orders-list') {
    const container = document.getElementById(containerElementId);
    if (!container) return;

    try {
      const res = await fetch(`${window.getApiBaseUrl()}/api/admin/orders?_t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      container.innerHTML = '';

      if (!data.orders || data.orders.length === 0) {
        container.innerHTML = '<div style="color: #8a94a6; padding: 12px; text-align: center;">Nenhuma solicitação pendente no momento.</div>';
        return;
      }

      data.orders.forEach(order => {
        const itemCard = document.createElement('div');
        itemCard.style.cssText = `
          background: rgba(18, 24, 38, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex;
          justify-content: space-between; align-items: center; gap: 12px;
        `;

        const qtd = order.items ? order.items.length : 0;
        const hora = new Date(order.timestamp).toLocaleTimeString();

        itemCard.innerHTML = `
          <div>
            <div style="font-weight: 800; color: #fff; font-size: 14px;">Pedido #${order.id}</div>
            <div style="font-size: 12px; color: #8a94a6; margin-top: 4px;">
              Horário: ${hora} | Itens: <b>${qtd}</b> ${order.ps4Ip ? `| Console: ${order.ps4Ip}` : ''}
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button onclick="decidirPedidoAdmin('${order.id}', 'approve')" 
              style="background: #2ecc71; color: #05070b; border: 0; padding: 8px 16px; border-radius: 6px; font-weight: 800; cursor: pointer;">
              Autorizar
            </button>
            <button onclick="decidirPedidoAdmin('${order.id}', 'reject')" 
              style="background: rgba(255, 69, 58, 0.15); color: #ff453a; border: 1px solid #ff453a; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer;">
              Recusar
            </button>
          </div>
        `;
        container.appendChild(itemCard);
      });

    } catch (err) {
      console.error("[GTSTORE] Erro ao carregar painel admin:", err);
    }
  };

  window.decidirPedidoAdmin = async function(orderId, acao) {
    try {
      const res = await fetch(`${window.getApiBaseUrl()}/api/admin/order/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: orderId, action: acao })
      });

      const data = await res.json();
      if (data.success) {
        exibirNotificacao(`Pedido #${orderId} ${acao === 'approve' ? 'autorizado' : 'recusado'}!`, "success");
        window.carregarPedidosAdmin();
      } else {
        exibirNotificacao("Falha: " + data.error, "error");
      }
    } catch (err) {
      exibirNotificacao("Erro de rede: " + err.message, "error");
    }
  };

  window.iniciarMonitorAdmin = function(containerId) {
    window.carregarPedidosAdmin(containerId);
    if (adminRefreshTimer) clearInterval(adminRefreshTimer);
    adminRefreshTimer = setInterval(() => window.carregarPedidosAdmin(containerId), 4000);
  };

  // 8. INTERFACE VISUAL (MODAL E NOTIFICAÇÕES)
  function exibirModalProcessamento(textoHtml) {
    let modal = document.getElementById('gt-modal-processing');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gt-modal-processing';
      modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(3, 5, 8, 0.88); backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px); display: flex; align-items: center;
        justify-content: center; z-index: 10000; font-family: inherit;
      `;
      modal.innerHTML = `
        <div style="background: rgba(14, 18, 27, 0.95); border: 1px solid #0070d1;
                    box-shadow: 0 0 30px rgba(0, 112, 209, 0.35); border-radius: 16px;
                    padding: 32px; max-width: 440px; width: 88%; text-align: center; color: #f5f7fa;">
          <div style="width: 42px; height: 42px; border: 4px solid rgba(0, 112, 209, 0.2);
                      border-top-color: #0070d1; border-radius: 50%; margin: 0 auto 20px;
                      animation: gt-spin 1s linear infinite;"></div>
          <h3 style="margin: 0 0 12px; font-size: 19px; font-weight: 800; color: #fff;">Aguardando Liberação</h3>
          <div id="gt-modal-msg" style="font-size: 14px; line-height: 1.6; color: #a5c7eb;"></div>
          <div style="margin-top: 24px; font-size: 11px; color: #8a94a6;">Mantenha esta página aberta no console.</div>
        </div>
      `;
      const style = document.createElement('style');
      style.innerHTML = `@keyframes gt-spin { to { transform: rotate(360deg); } }`;
      document.head.appendChild(style);
      document.body.appendChild(modal);
    }

    atualizarMensagemModal(textoHtml);
    modal.style.display = 'flex';
  }

  function atualizarMensagemModal(textoHtml) {
    const el = document.getElementById('gt-modal-msg');
    if (el) el.innerHTML = textoHtml;
  }

  function fecharModalProcessamento() {
    const modal = document.getElementById('gt-modal-processing');
    if (modal) modal.style.display = 'none';
  }

  function exibirNotificacao(texto, tipo = "info") {
    let container = document.getElementById('gt-toasts-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'gt-toasts-container';
      container.style.cssText = `position: fixed; bottom: 20px; right: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 8px;`;
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    const corBorda = tipo === 'success' ? '#2ecc71' : tipo === 'error' ? '#ff453a' : tipo === 'warning' ? '#ff9f0a' : '#0070d1';

    toast.style.cssText = `
      background: rgba(14, 18, 27, 0.95); border-left: 4px solid ${corBorda};
      border: 1px solid rgba(255, 255, 255, 0.1); border-left-width: 4px;
      color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      transition: opacity 0.3s ease;
    `;
    toast.innerText = texto;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

})();
</script>
