<!-- ========================================================================= -->
<!-- MÓDULO DE SINCRONIZAÇÃO, CHECKOUT, POLLING E PAINEL ADMINISTRATIVO        -->
<!-- ========================================================================= -->
<script>
(() => {
  // --- ESTADO GLOBAL DA APLICAÇÃO ---
  let statusPollTimer = null;
  let adminRefreshTimer = null;
  const POLL_INTERVAL_MS = 2500;
  const MAX_POLL_ATTEMPTS = 120; // ~5 minutos de espera limite

  // =========================================================================
  // 1. GERENCIAMENTO DE IP DO PS4 (LOCALSTORAGE)
  // =========================================================================
  function getPs4Ip() {
    return localStorage.getItem('gtstore_ps4_ip') || '';
  }

  function setPs4Ip(ip) {
    const limpo = ip.trim();
    localStorage.setItem('gtstore_ps4_ip', limpo);
    const input = document.querySelector('.ps4-ip-input');
    if (input) input.value = limpo;
  }

  // Inicializa inputs de IP existentes na interface
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.querySelector('.ps4-ip-input');
    const btnSave = document.querySelector('.btn-save-ip');
    if (input) {
      input.value = getPs4Ip();
      input.addEventListener('change', (e) => setPs4Ip(e.target.value));
    }
    if (btnSave && input) {
      btnSave.addEventListener('click', () => {
        setPs4Ip(input.value);
        exibirNotificacao("IP do PS4 salvo com sucesso!", "success");
      });
    }
  });

  // =========================================================================
  // 2. CHECKOUT E ENVIO DO PEDIDO (CLIENTE / PS4)
  // =========================================================================

  /**
   * Chamada principal de finalização do carrinho.
   * @param {Array<string>} itens - Lista de nomes ou URLs dos arquivos PKG.
   */
  window.iniciarCheckout = async function(itens) {
    if (!itens || itens.length === 0) {
      exibirNotificacao("O carrinho está vazio.", "warning");
      return;
    }

    try {
      exibirModalProcessamento("Enviando solicitação de autorização...");

      // Requisição em caminho relativo (resolve tanto em LAN quanto em WAN externa)
      const response = await fetch('/api/order/create', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          items: itens,
          ps4Ip: getPs4Ip()
        })
      });

      if (!response.ok) {
        throw new Error(`Erro na resposta do servidor HTTP (${response.status})`);
      }

      const data = await response.json();

      if (!data.success || !data.orderId) {
        throw new Error(data.error || "Servidor não gerou ID para o pedido.");
      }

      console.log(`[GTSTORE] Pedido #${data.orderId} criado com sucesso.`);
      atualizarMensagemModal(
        `Solicitação <b>#${data.orderId}</b> registrada!<br><br>` +
        `Aguardando autorização na aba <b>Admin</b>...`
      );

      // Inicia a verificação contínua no navegador do PS4
      iniciarLoopPolling(data.orderId);

    } catch (err) {
      console.error("[GTSTORE] Erro no checkout:", err);
      fecharModalProcessamento();
      exibirNotificacao("Falha ao enviar pedido: " + err.message, "error");
    }
  };

  // =========================================================================
  // 3. POLLING DE STATUS NO NAVEGADOR DO CONSOLE (IMUNE A NAT / CGNAT)
  // =========================================================================

  function iniciarLoopPolling(orderId) {
    if (statusPollTimer) clearTimeout(statusPollTimer);

    let tentativas = 0;

    const executarChecagem = async () => {
      tentativas++;

      try {
        // no-store e timestamp forçam o navegador WebKit do PS4 a ignorar cache
        const url = `/api/order/status?id=${encodeURIComponent(orderId)}&_t=${Date.now()}`;
        const res = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const dados = await res.json();

        // 1. Aprovado pelo Administrador
        if (dados.status === 'approved') {
          fecharModalProcessamento();
          exibirNotificacao("Pedido AUTORIZADO pelo Administrador!", "success");
          processarInstalacaoNoConsole(dados);
          return;
        }

        // 2. Rejeitado pelo Administrador
        if (dados.status === 'rejected') {
          fecharModalProcessamento();
          exibirNotificacao("A solicitação foi recusada pelo administrador.", "error");
          return;
        }

        // 3. Ainda Pendente
        if (tentativas < MAX_POLL_ATTEMPTS) {
          statusPollTimer = setTimeout(executarChecagem, POLL_INTERVAL_MS);
        } else {
          fecharModalProcessamento();
          exibirNotificacao("Tempo de espera esgotado. Entre em contato com o suporte.", "warning");
        }

      } catch (err) {
        console.warn(`[GTSTORE] Tentativa ${tentativas} falhou. Tentando novamente...`, err);
        if (tentativas < MAX_POLL_ATTEMPTS) {
          statusPollTimer = setTimeout(executarChecagem, POLL_INTERVAL_MS);
        } else {
          fecharModalProcessamento();
          exibirNotificacao("Comunicação interrompida com o servidor.", "error");
        }
      }
    };

    // Primeira checagem após 1.5s
    statusPollTimer = setTimeout(executarChecagem, 1500);
  }

  // =========================================================================
  // 4. DISPARO LOCAL DE INSTALAÇÃO NO PS4 (RPI - PORTA 12800)
  // =========================================================================

  /**
   * Como o navegador roda dentro do próprio PS4, chamamos diretamente
   * a interface de loopback do console (127.0.0.1:12800), contornando
   * qualquer bloqueio de porta do roteador na internet.
   */
  async function processarInstalacaoNoConsole(dadosPedido) {
    if (!dadosPedido.items || dadosPedido.items.length === 0) {
      exibirNotificacao("Autorização concluída (nenhum pacote anexado).", "info");
      return;
    }

    exibirNotificacao(`Enviando ${dadosPedido.items.length} pacote(s) para o instalador...`, "info");

    for (let i = 0; i < dadosPedido.items.length; i++) {
      const urlPkg = dadosPedido.items[i];
      console.log(`[GTSTORE] Enviando para instalador local: ${urlPkg}`);

      try {
        // Envio direto para o Remote Package Installer na mesma máquina
        const rpiResponse = await fetch('http://127.0.0.1:12800/server/install', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: "direct",
            packages: [urlPkg]
          })
        });

        if (rpiResponse.ok) {
          exibirNotificacao(`Instalação iniciada: Pacote ${i + 1}/${dadosPedido.items.length}`, "success");
        } else {
          console.warn("[GTSTORE] RPI retornou código: " + rpiResponse.status);
        }
      } catch (err) {
        console.warn("[GTSTORE] Falha ao enviar para 127.0.0.1:12800. Tentando IP configurado...", err);

        // Fallback: se o navegador estiver rodando fora do PS4, tenta o IP manual salvo
        const ipManual = getPs4Ip();
        if (ipManual) {
          try {
            await fetch(`http://${ipManual}:12800/server/install`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: "direct", packages: [urlPkg] })
            });
            exibirNotificacao(`Enviado via IP manual (${ipManual})`, "success");
          } catch (_e) {
            console.error("[GTSTORE] RPI inacessível no IP manual.");
          }
        }
      }
    }
  }

  // =========================================================================
  // 5. PAINEL DE CONTROLE DO ADMINISTRADOR (ABA ADMIN)
  // =========================================================================

  /**
   * Busca no backend todos os pedidos em espera para renderização na lista do Admin.
   */
  window.carregarPedidosAdmin = async function(containerElementId = 'admin-orders-list') {
    const container = document.getElementById(containerElementId);
    if (!container) return;

    try {
      const res = await fetch('/api/admin/orders?_t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error("Falha HTTP " + res.status);
      const data = await res.json();

      container.innerHTML = '';

      if (!data.orders || data.orders.length === 0) {
        container.innerHTML = '<div style="color: #8a94a6; padding: 12px; text-align: center;">Nenhuma solicitação pendente no momento.</div>';
        return;
      }

      data.orders.forEach(order => {
        const itemCard = document.createElement('div');
        itemCard.style.cssText = `
          background: rgba(18, 24, 38, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex;
          justify-content: space-between; align-items: center; gap: 12px;
        `;

        const qtd = order.items ? order.items.length : 0;
        const hora = new Date(order.timestamp).toLocaleTimeString();

        itemCard.innerHTML = `
          <div>
            <div style="font-weight: 800; color: #fff; font-size: 14px;">Pedido #${order.id}</div>
            <div style="font-size: 12px; color: #8a94a6; margin-top: 4px;">
              Horário: ${hora} | Itens: <b>${qtd}</b> ${order.ps4Ip ? `| PS4: ${order.ps4Ip}` : ''}
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button onclick="decidirPedidoAdmin('${order.id}', 'approve')" 
              style="background: #2ecc71; color: #05070b; border: 0; padding: 8px 16px; border-radius: 6px; font-weight: 800; cursor: pointer;">
              Autorizar
            </button>
            <button onclick="decidirPedidoAdmin('${order.id}', 'reject')" 
              style="background: rgba(255, 69, 58, 0.15); color: #ff453a; border: 1px solid #ff453a; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer;">
              Recusar
            </button>
          </div>
        `;
        container.appendChild(itemCard);
      });

    } catch (err) {
      console.error("[GTSTORE] Erro ao carregar painel admin:", err);
    }
  };

  /**
   * Envia a decisão de aprovação ou recusa do Administrador.
   */
  window.decidirPedidoAdmin = async function(orderId, acao) {
    try {
      const res = await fetch('/api/admin/order/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: orderId, action: acao })
      });

      const data = await res.json();
      if (data.success) {
        exibirNotificacao(`Pedido #${orderId} ${acao === 'approve' ? 'aprovado' : 'recusado'} com sucesso!`, "success");
        window.carregarPedidosAdmin();
      } else {
        exibirNotificacao("Falha ao registrar ação: " + data.error, "error");
      }
    } catch (err) {
      exibirNotificacao("Erro de rede ao responder pedido: " + err.message, "error");
    }
  };

  /**
   * Liga a atualização automática da aba de administração.
   */
  window.iniciarMonitorAdmin = function(containerId) {
    window.carregarPedidosAdmin(containerId);
    if (adminRefreshTimer) clearInterval(adminRefreshTimer);
    adminRefreshTimer = setInterval(() => window.carregarPedidosAdmin(containerId), 4000);
  };

  // =========================================================================
  // 6. COMPONENTES VISUAIS (MODAL E TOASTS)
  // =========================================================================

  function exibirModalProcessamento(textoHtml) {
    let modal = document.getElementById('gt-modal-processing');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gt-modal-processing';
      modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(3, 5, 8, 0.88); backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px); display: flex; align-items: center;
        justify-content: center; z-index: 10000; font-family: inherit;
      `;
      modal.innerHTML = `
        <div style="background: rgba(14, 18, 27, 0.95); border: 1px solid #0070d1;
                    box-shadow: 0 0 30px rgba(0, 112, 209, 0.35); border-radius: 16px;
                    padding: 32px; max-width: 440px; width: 88%; text-align: center; color: #f5f7fa;">
          <div style="width: 42px; height: 42px; border: 4px solid rgba(0, 112, 209, 0.2);
                      border-top-color: #0070d1; border-radius: 50%; margin: 0 auto 20px;
                      animation: gt-spin 1s linear infinite;"></div>
          <h3 style="margin: 0 0 12px; font-size: 19px; font-weight: 800; color: #fff;">Aguardando Liberação</h3>
          <div id="gt-modal-msg" style="font-size: 14px; line-height: 1.6; color: #a5c7eb;"></div>
          <div style="margin-top: 24px; font-size: 11px; color: #8a94a6;">Por favor, mantenha esta página aberta no console.</div>
        </div>
      `;
      const style = document.createElement('style');
      style.innerHTML = `@keyframes gt-spin { to { transform: rotate(360deg); } }`;
      document.head.appendChild(style);
      document.body.appendChild(modal);
    }

    atualizarMensagemModal(textoHtml);
    modal.style.display = 'flex';
  }

  function atualizarMensagemModal(textoHtml) {
    const el = document.getElementById('gt-modal-msg');
    if (el) el.innerHTML = textoHtml;
  }

  function fecharModalProcessamento() {
    const modal = document.getElementById('gt-modal-processing');
    if (modal) modal.style.display = 'none';
  }

  function exibirNotificacao(texto, tipo = "info") {
    let container = document.getElementById('gt-toasts-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'gt-toasts-container';
      container.style.cssText = `position: fixed; bottom: 20px; right: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 8px;`;
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    const corBorda = tipo === 'success' ? '#2ecc71' : tipo === 'error' ? '#ff453a' : tipo === 'warning' ? '#ff9f0a' : '#0070d1';

    toast.style.cssText = `
      background: rgba(14, 18, 27, 0.95); border-left: 4px solid ${corBorda};
      border: 1px solid rgba(255, 255, 255, 0.1); border-left-width: 4px;
      color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      transition: opacity 0.3s ease;
    `;
    toast.innerText = texto;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

})();
</script>
