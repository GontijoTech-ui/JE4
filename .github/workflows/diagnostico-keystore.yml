name: Diagnóstico Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Diagnóstico Aprofundado de Assinatura
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$SIGNING_KEY" | base64 -d > signingKey.jks

          # Sanitiza variáveis
          ALIAS=$(echo "$KEY_ALIAS" | tr -d '\r\n[:space:]')
          KEY_PASS=$(echo "$KEY_PASSWORD" | tr -d '\r\n')
          STORE_PASS=$(echo "$KEYSTORE_PASSWORD" | tr -d '\r\n')

          echo "Target Alias: '$ALIAS'"

          echo "=== 1. Detalhes completos do Keystore ==="
          keytool -list -v -keystore signingKey.jks -storepass "$STORE_PASS" -alias "$ALIAS" | grep -E "Alias name|Entry type|Keystore type" || true

          echo ""
          echo "=== 2. Testando carregamento da chave privada com KEY_PASSWORD ==="
          cat << 'EOF' > test_signer.sh
          KEY_PASS_ARG="$1"
          STORE_PASS_ARG="$2"
          ALIAS_ARG="$3"

          # Tenta alterar a senha temporariamente da chave para ela mesma como prova de acesso à PrivateKey
          keytool -keypasswd -keystore signingKey.jks -alias "$ALIAS_ARG" -storepass "$STORE_PASS_ARG" -keypass "$KEY_PASS_ARG" -new "$KEY_PASS_ARG" 2> err.log
          EOF
          chmod +x test_signer.sh

          if ./test_signer.sh "$KEY_PASS" "$STORE_PASS" "$ALIAS"; then
            echo "🎉 SUCESSO! A KEY_PASSWORD abre a chave privada perfeitamente!"
            exit 0
          else
            echo "❌ Falha com KEY_PASSWORD. Detalhe do Java:"
            cat err.log | sed 's/'"$KEY_PASS"'/REDACTED/g' | sed 's/'"$STORE_PASS"'/REDACTED/g'
          fi

          echo ""
          echo "=== 3. Testando se a senha da chave privada é a KEYSTORE_PASSWORD ==="
          if ./test_signer.sh "$STORE_PASS" "$STORE_PASS" "$ALIAS"; then
            echo "🎉 SUCESSO! A senha da chave privada é a mesma KEYSTORE_PASSWORD!"
            echo "👉 Ação: Vá nas Secrets e coloque o valor de KEYSTORE_PASSWORD dentro de KEY_PASSWORD."
            exit 0
          else
            echo "❌ Falha também com KEYSTORE_PASSWORD. Detalhe do Java:"
            cat err.log | sed 's/'"$STORE_PASS"'/REDACTED/g'
          fi
