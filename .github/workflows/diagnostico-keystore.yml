name: Diagnóstico Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Teste Real de Assinatura (jarsigner)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$SIGNING_KEY" | base64 -d > signingKey.jks

          ALIAS=$(echo "$KEY_ALIAS" | tr -d '\r\n[:space:]')
          STORE_PASS=$(echo "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASS=$(echo "$KEY_PASSWORD" | tr -d '\r\n')

          # 1. Cria um arquivo zip/jar de teste para assinar
          echo "conteudo de teste" > dummy.txt
          jar -cf test_app.jar dummy.txt

          echo "=== 1. Testando assinatura com KEY_PASSWORD ==="
          if jarsigner -keystore signingKey.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" test_app.jar "$ALIAS" > jarsigner.log 2>&1; then
            echo "🎉 SUCESSO ABSOLUTO! A chave assinou com a Secret KEY_PASSWORD!"
            jarsigner -verify test_app.jar
            exit 0
          fi

          echo "=== 2. Testando assinatura usando KEYSTORE_PASSWORD como keypass (Padrão PKCS12) ==="
          if jarsigner -keystore signingKey.jks -storepass "$STORE_PASS" -keypass "$STORE_PASS" test_app.jar "$ALIAS" > jarsigner.log 2>&1; then
            echo "🎉 SUCESSO ABSOLUTO! A chave assinou perfeitamente usando a KEYSTORE_PASSWORD!"
            echo "👉 Ação necessária: Vá nas Secrets do repositório e coloque a mesma senha de KEYSTORE_PASSWORD na Secret KEY_PASSWORD."
            jarsigner -verify test_app.jar
            exit 0
          fi

          echo "❌ Falha ao assinar. Detalhes técnicos:"
          cat jarsigner.log
          exit 1
