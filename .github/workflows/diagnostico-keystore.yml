name: Diagnóstico Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Testar senhas no alias correto
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$SIGNING_KEY" | base64 -d > signingKey.jks

          echo "=== Testando com a Secret KEY_PASSWORD ==="
          if keytool -certreq -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            echo "🎉 SUCESSO TOTAL: A KEY_PASSWORD é válida para o alias '$KEY_ALIAS'!"
            exit 0
          else
            echo "❌ KEY_PASSWORD ainda falhou."
          fi

          echo "=== Testando se a senha da chave é a própria KEYSTORE_PASSWORD ==="
          if keytool -certreq -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "💡 SUCESSO: A chave aceitou a KEYSTORE_PASSWORD! Basta atualizar a Secret KEY_PASSWORD para ficar com o mesmo valor de KEYSTORE_PASSWORD."
            exit 0
          else
            echo "❌ Nem KEY_PASSWORD nem KEYSTORE_PASSWORD abriram a chave '$KEY_ALIAS'."
            exit 1
          fi
