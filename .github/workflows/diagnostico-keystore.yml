name: Diagnóstico Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspecionar conteúdo e senhas da Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=== 1. Decodificando Keystore ==="
          echo "$SIGNING_KEY" | base64 -d > signingKey.jks
          echo "✅ Keystore reconstruída."

          echo "=== 2. Listando todas as entradas presentes no arquivo ==="
          # Extrai o nome do Alias e o Tipo de entrada de cada item presente
          keytool -list -v -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" | grep -E "Alias name:|Entry type:" || true

          echo "=== 3. Detalhes do alias configurado atual ('$KEY_ALIAS') ==="
          ENTRY_TYPE=$(keytool -list -v -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep "Entry type:" || echo "Não encontrado")
          echo "Tipo de entrada atual: $ENTRY_TYPE"

          echo "=== 4. Teste de senhas para o alias '$KEY_ALIAS' ==="
          if keytool -certreq -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            echo "✅ A chave aceita a KEY_PASSWORD configurada."
          else
            echo "❌ KEY_PASSWORD atual foi rejeitada."
            
            # Testa se a senha da chave é idêntica à senha do keystore
            if keytool -certreq -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "💡 DICA: A chave aceitou a KEYSTORE_PASSWORD como sua senha de chave! Basta atualizar a Secret KEY_PASSWORD com o mesmo valor de KEYSTORE_PASSWORD."
            else
              echo "⚠️ A chave também não aceita a KEYSTORE_PASSWORD."
            fi
          fi
