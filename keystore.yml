name: Diagnóstico Keystore

on:
  workflow_dispatch:

jobs:
  test-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validar integridade das Secrets e Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=== 1. Verificando presença das Secrets ==="
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Erro: Uma ou mais secrets estão ausentes ou vazias."
            exit 1
          fi
          echo "✅ Todas as 4 Secrets foram carregadas no ambiente."

          echo "=== 2. Decodificando SIGNING_KEY para JKS ==="
          echo "$SIGNING_KEY" | base64 -d > signingKey.jks

          if [ ! -s signingKey.jks ]; then
            echo "❌ Erro: O arquivo signingKey.jks ficou vazio. Verifique se o conteúdo de SIGNING_KEY é um Base64 válido."
            exit 1
          fi
          echo "✅ Keystore decodificada com sucesso."

          echo "=== 3. Testando KEYSTORE_PASSWORD ==="
          if ! keytool -list -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" > keystore_content.txt 2> error_ks.txt; then
            echo "❌ Erro: Senha da Keystore inválida (KEYSTORE_PASSWORD falhou)."
            cat error_ks.txt
            exit 1
          fi
          echo "✅ Keystore aberta com sucesso com a KEYSTORE_PASSWORD."

          echo "=== 4. Verificando KEY_ALIAS ==="
          ALIAS_DATA=$(keytool -list -v -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null || true)

          if [ -z "$ALIAS_DATA" ]; then
            echo "❌ Erro: O alias '$KEY_ALIAS' não foi encontrado no arquivo de chaves."
            echo "Entradas disponíveis no arquivo:"
            grep -E "Entry,.*|PrivateKeyEntry|trustedCertEntry" keystore_content.txt || cat keystore_content.txt
            exit 1
          fi

          if echo "$ALIAS_DATA" | grep -q "PrivateKeyEntry"; then
            echo "✅ Alias '$KEY_ALIAS' localizado e confirmado como PrivateKeyEntry (apto para assinar APKs/AABs)."
          else
            echo "⚠️ Aviso: Alias encontrado, mas não está classificado como PrivateKeyEntry."
          fi

          echo "=== 5. Testando KEY_PASSWORD ==="
          if keytool -certreq -keystore signingKey.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            echo "✅ KEY_PASSWORD válida para o alias '$KEY_ALIAS'."
          else
            echo "❌ Erro: KEY_PASSWORD incorreta para o alias especificado."
            exit 1
          fi

          echo "🎉 SUCESSO: O conjunto de 4 Secrets é 100% consistente, válido e pronto para uso em produção."
